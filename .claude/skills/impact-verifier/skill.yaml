name: impact-verifier
version: 2.0.0
description: Qualify immutable evidence, record independent review and separate human decisions from submission approval.
bounded_context: ImpactContext
safety_tier: passive
owasp_wstg:
  - WSTG-REPT-01
  - WSTG-REPT-02
owasp_api_top10: []
severity_range: [info, low, medium, high, critical]
tools_required:
  - python3
  - jq
input_files: []
workflows:
  record-review:
    description: Record an independent structured assessment against an assigned read-only evidence snapshot.
    inputs: [OUTDIR, REVIEW_REQUEST]
    auth_required: false
    side_effects: [local_state_write]
    safety_tier: passive
    command: |
      python3 .claude/skills/impact-verifier/scripts/review_workflow.py \
        --request "${REVIEW_REQUEST:?Set REVIEW_REQUEST to a review.record JSON request}" \
        --output "$OUTDIR/impact-verifier/review.json"
    outputs:
      - $OUTDIR/impact-verifier/review.json
    evidence_dir: $OUTDIR/impact-verifier
    detection_signals:
      - "review records principal/session, evidence references, alternatives and reportability dimensions"
    false_positives:
      - "independent agent recommendations do not confirm findings or approve submission"

  collect-candidates:
    description: Aggregate candidate findings from all skill output directories.
    inputs: [OUTDIR]
    command: |
      mkdir -p $OUTDIR/impact-verifier && \
      python3 .claude/skills/impact-verifier/scripts/impact_analyzer.py --context .bb/context.json --action collect --outdir $OUTDIR --output $OUTDIR/impact-verifier/candidates.jsonl
    outputs:
      - $OUTDIR/impact-verifier/candidates.jsonl
      - kind: finding
        path: $OUTDIR/impact-verifier/candidates.jsonl
    evidence_dir: $OUTDIR/impact-verifier
    safety_tier: passive
    next:
      if_findings: classify-impact
      if_no_findings: null

  classify-impact:
    description: Classify each candidate by impact class and severity.
    inputs: [OUTDIR]
    command: |
      mkdir -p $OUTDIR/impact-verifier && \
      python3 .claude/skills/impact-verifier/scripts/impact_analyzer.py --context .bb/context.json --action classify --candidates $OUTDIR/impact-verifier/candidates.jsonl --output $OUTDIR/impact-verifier/candidates.jsonl
    outputs:
      - $OUTDIR/impact-verifier/candidates.jsonl
    evidence_dir: $OUTDIR/impact-verifier
    safety_tier: passive
    detection_signals:
      - "impact class assigned: data_exposure, privilege_escalation, tenant_break, account_takeover, financial_loss, rce, xss, ssrf"
    next:
      if_findings: verify-data-exposure
      if_no_findings: null

  verify-data-exposure:
    description: Collect class-matched unreviewed claims for governed evidence review; classification does not prove impact.
    inputs: [OUTDIR]
    command: |
      mkdir -p $OUTDIR/impact-verifier/evidence && \
      python3 .claude/skills/impact-verifier/scripts/impact_analyzer.py --context .bb/context.json --action verify --impact-class data_exposure --candidates $OUTDIR/impact-verifier/candidates.jsonl --output $OUTDIR/impact-verifier/verified.jsonl --rejected $OUTDIR/impact-verifier/rejected.jsonl
    outputs:
      - $OUTDIR/impact-verifier/verified.jsonl
      - $OUTDIR/impact-verifier/rejected.jsonl
    evidence_dir: $OUTDIR/impact-verifier/evidence/
    safety_tier: passive
    detection_signals:
      - "class-matched claims remain unreviewed until governed evidence review"
      - "ownership and tenant assertions require independent evidence assessment"
    false_positives:
      - "public or intentionally shared data"
      - "example or test data"
    next:
      if_findings: verify-privilege-escalation
      if_no_findings: verify-privilege-escalation

  verify-privilege-escalation:
    description: Collect class-matched unreviewed claims for governed evidence review; classification does not prove impact.
    inputs: [OUTDIR]
    command: |
      mkdir -p $OUTDIR/impact-verifier/evidence && \
      python3 .claude/skills/impact-verifier/scripts/impact_analyzer.py --context .bb/context.json --action verify --impact-class privilege_escalation --candidates $OUTDIR/impact-verifier/candidates.jsonl --output $OUTDIR/impact-verifier/verified.jsonl --rejected $OUTDIR/impact-verifier/rejected.jsonl
    outputs:
      - $OUTDIR/impact-verifier/verified.jsonl
      - $OUTDIR/impact-verifier/rejected.jsonl
    evidence_dir: $OUTDIR/impact-verifier/evidence/
    safety_tier: passive
    next:
      if_findings: verify-account-takeover
      if_no_findings: verify-account-takeover

  verify-account-takeover:
    description: Collect class-matched unreviewed claims for governed evidence review; classification does not prove impact.
    inputs: [OUTDIR]
    command: |
      mkdir -p $OUTDIR/impact-verifier/evidence && \
      python3 .claude/skills/impact-verifier/scripts/impact_analyzer.py --context .bb/context.json --action verify --impact-class account_takeover --candidates $OUTDIR/impact-verifier/candidates.jsonl --output $OUTDIR/impact-verifier/verified.jsonl --rejected $OUTDIR/impact-verifier/rejected.jsonl
    outputs:
      - $OUTDIR/impact-verifier/verified.jsonl
      - $OUTDIR/impact-verifier/rejected.jsonl
    evidence_dir: $OUTDIR/impact-verifier/evidence/
    safety_tier: passive
    next:
      if_findings: verify-tenant-break
      if_no_findings: verify-tenant-break

  verify-tenant-break:
    description: Collect class-matched unreviewed claims for governed evidence review; classification does not prove impact.
    inputs: [OUTDIR]
    command: |
      mkdir -p $OUTDIR/impact-verifier/evidence && \
      python3 .claude/skills/impact-verifier/scripts/impact_analyzer.py --context .bb/context.json --action verify --impact-class tenant_break --candidates $OUTDIR/impact-verifier/candidates.jsonl --output $OUTDIR/impact-verifier/verified.jsonl --rejected $OUTDIR/impact-verifier/rejected.jsonl
    outputs:
      - $OUTDIR/impact-verifier/verified.jsonl
      - $OUTDIR/impact-verifier/rejected.jsonl
    evidence_dir: $OUTDIR/impact-verifier/evidence/
    safety_tier: passive
    next:
      if_findings: false-positive-gate
      if_no_findings: false-positive-gate

  false-positive-gate:
    description: Run automated false-positive checks on all candidates.
    inputs: [OUTDIR]
    command: |
      mkdir -p $OUTDIR/impact-verifier && \
      python3 .claude/skills/impact-verifier/scripts/impact_analyzer.py --context .bb/context.json --action fp-check --candidates $OUTDIR/impact-verifier/candidates.jsonl --false-positive-db ${FP_DB:-.claude/skills/impact-verifier/false_positives.yaml} --output $OUTDIR/impact-verifier/candidates.jsonl
    outputs:
      - $OUTDIR/impact-verifier/candidates.jsonl
    evidence_dir: $OUTDIR/impact-verifier
    safety_tier: passive
    detection_signals:
      - "false positive patterns matched and flagged on candidates"
    next:
      if_findings: report-readiness
      if_no_findings: report-readiness

  report-readiness:
    description: Identify legacy file claims requiring governed evidence review.
    inputs: [OUTDIR]
    command: |
      mkdir -p $OUTDIR/impact-verifier && \
      python3 .claude/skills/impact-verifier/scripts/impact_analyzer.py --context .bb/context.json --action readiness --verified $OUTDIR/impact-verifier/verified.jsonl --output $OUTDIR/impact-verifier/readiness_report.md
    outputs:
      - $OUTDIR/impact-verifier/readiness_report.md
    evidence_dir: $OUTDIR/impact-verifier
    safety_tier: passive
    detection_signals:
      - "legacy file labels never establish report readiness"
      - "submission approval remains unavailable"
    next:
      if_findings: cvss4-score
      if_no_findings: cvss4-score

  cvss4-score:
    description: Calculate CVSS v4.0 score and severity from a vector string.
    inputs: [OUTDIR]
    command: |
      mkdir -p $OUTDIR/impact-verifier && \
      python3 .claude/skills/impact-verifier/scripts/cvss40_calc.py \
        --vector "${CVSS4_VECTOR:?Set CVSS4_VECTOR, e.g. CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H}" \
        --output $OUTDIR/impact-verifier/cvss4.json
    outputs:
      - $OUTDIR/impact-verifier/cvss4.json
    evidence_dir: $OUTDIR/impact-verifier/evidence/
    safety_tier: passive
    detection_signals:
      - "CVSS 4.0 macrovector derived and severity classified"
    false_positives:
      - "numeric score is interpolated within official band; FIRST calculator is authoritative"
    next:
      if_findings: impact-narrative
      if_no_findings: impact-narrative

  impact-narrative:
    description: Generate structured impact narrative with attack scenario and PII detection.
    inputs: [OUTDIR, FINDING_DIR]
    command: |
      mkdir -p $OUTDIR/impact-verifier && \
      python3 .claude/skills/impact-verifier/scripts/impact_narrative.py generate \
        --finding-dir "${FINDING_DIR:?Set FINDING_DIR}" \
        --impact-class "${IMPACT_CLASS:?Set IMPACT_CLASS, e.g. account_takeover}" \
        --target-url "${TARGET_URL:-}" \
        --output $OUTDIR/impact-verifier/impact.md
    outputs:
      - $OUTDIR/impact-verifier/impact.md
    evidence_dir: $OUTDIR/impact-verifier/evidence/
    safety_tier: passive
    detection_signals:
      - "impact narrative generated with attack scenario walkthrough"
      - "PII fields detected in response evidence elevate impact"
    false_positives:
      - "narrative templates are starting points; verify against actual target behavior"
    next:
      if_findings: null
      if_no_findings: null

evidence_templates:
  verified_finding: "Legacy filename only; candidate requires immutable manifest and independent review"
  readiness_report: "Scored findings with evidence gaps and fix recommendations"
  cvss4_score: "CVSS 4.0 vector, metrics breakdown, macrovector, severity class"
  impact_narrative: "Impact text, attack scenario, observed data classes, CVSS hints"